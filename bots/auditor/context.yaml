# Runtime Context v2 (schema: schemas/position-context.schema.json).
# Standing context is the compiled runtime contract (orgctl render-bot); every
# source below is retrieved only when its trigger applies. Triggers named in
# policies/runtime-contract.yaml also contribute their required_sources.
schema_version: 2
standing_budget_chars: 5500
execution_profile: auditor
position_knowledge: knowledge/positions/auditor.md
retrieve_when:
  authority_question: [adr/, policies/]
  risk_classification: []
  knowledge_checkpoint: [knowledge/company/]
  evidence_verification: [schemas/evidence.schema.json, schemas/approval.schema.json, reports/, operations/]
  external_action: []
  role_detail: [AGENTS.md, organization.yaml, roles/auditor.md]
  domain_reference: [workforce/roster.yaml, workforce/events/, workforce/contributions/]
