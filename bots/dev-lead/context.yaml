# Runtime Context v2 (schema: schemas/position-context.schema.json).
# Standing context is the compiled runtime contract (orgctl render-bot); every
# source below is retrieved only when its trigger applies. Triggers named in
# policies/runtime-contract.yaml also contribute their required_sources.
schema_version: 2
standing_budget_chars: 5000
execution_profile: implementer
position_knowledge: knowledge/positions/dev-lead.md
retrieve_when:
  authority_question: []
  risk_classification: []
  knowledge_checkpoint: [knowledge/company/]
  evidence_verification: [schemas/result-envelope.schema.json]
  external_action: []
  executor_selection: [routing/, docs/EXECUTOR_ROUTING.md, schemas/task-envelope.schema.json]
  execution_orchestration: []
  production_change: []
  incident_response: [runbooks/]
  role_detail: [AGENTS.md, organization.yaml, roles/dev-lead.md]
  domain_reference: [roles/software-architect.md, evals/, EVALS.md]
